name: RAG evaluation (manual)

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Name for this run (e.g. baseline, chunk300)"
        required: true
        default: baseline
      top_k:
        description: "Chunks to retrieve"
        required: false
        default: "4"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      - run: python -m ingest.ingest
      - name: Run evaluation (calls your LLM provider)
        env:
          LLM_PROVIDER: gemini   # change to groq/openrouter and add the matching secret
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m eval.run_eval --label "${{ inputs.label }}" --top-k "${{ inputs.top_k }}"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.label }}
          path: eval/results/*.json
