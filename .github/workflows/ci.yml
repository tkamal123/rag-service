name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (also builds the vector index)
        run: docker build -t rag-service:${{ github.sha }} .
      - name: Smoke test the container
        run: |
          docker run -d --name rag -p 8080:8080 rag-service:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break || sleep 2; done
          curl -sf localhost:8080/health | grep '"status":"ok"'
